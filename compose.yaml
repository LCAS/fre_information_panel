services:
  fre_information_panel:
    image: ghcr.io/lcas/fre_information_panel:latest
    stdin_open: true
    tty: true
    ports:
      - '5173:5173'
    networks:
      - ros_net
    environment:
      - ROS_DOMAIN_ID=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FRE_INFORMATION_PANEL_BRIDGE_ENDPOINT=/capability
      - FRE_INFORMATION_PANEL_ALERT_PERSISTENCE_MS=5000
      - FRE_INFORMATION_PANEL_ALERT_ANNOUNCEMENT_WITH_INTRODUCTION=true

networks:
  ros_net:
