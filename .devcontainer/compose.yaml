services:
  develop:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
      target: devcontainer
    volumes:
      - ../:/workspace
      - colcon_build:/workspace/build
      - colcon_install:/workspace/install
      - colcon_log:/workspace/log
    stdin_open: true
    tty: true
    ports:
      - "5173:5173"
      - "9000:9000"
    networks:
      - ros_net
    environment:
      - DISPLAY=:1.0
      - ROS_DOMAIN_ID=10

volumes:
  colcon_build:
  colcon_install:
  colcon_log:

networks:
  ros_net:
